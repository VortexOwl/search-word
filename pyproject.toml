[project]
name = "search-word"
version = "0.1.0"
description = "Приложение для поиска русских существительных слов по заданным фильтрам."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "fastapi[standard]>=0.136.3",
    "pyinstaller>=6.22.3",
]

[project.scripts]
start = "start:start_web"
console = "start:start_console"
default = "start:start_default"
clear = "start:start_clear"

[tool.uv]
package = true
